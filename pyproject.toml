[project]
name = "clearcast-email-url-security"
version = "0.1.0"
description = "Explainable local-first phishing email and URL analyzer"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "pandas>=2.2,<4", "joblib>=1.4,<2", "streamlit>=1.40,<2", "openpyxl>=3.1,<4", "pyarrow>=18,<30"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
